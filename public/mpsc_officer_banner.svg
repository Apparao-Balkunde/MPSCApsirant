<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="40%" stop-color="#1c1917" />
      <stop offset="80%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>

    <!-- Warm Golden Sunburst -->
    <radialGradient id="sunGlow" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="25%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Amber Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#sunGlow)" />

  <!-- Top Tricolor Pride Line -->
  <rect x="0" y="0" width="400" height="6" fill="#ff9933" />
  <rect x="400" y="0" width="400" height="6" fill="#ffffff" />
  <rect x="800" y="0" width="400" height="6" fill="#138808" />

  <!-- Geometric Grid Accent in Background -->
  <g opacity="0.12" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Content Area (Typographic & Prestige Branding) -->
  <g transform="translate(80, 100)">
    <!-- Mission Badge -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#f59e0b" />
    <text x="36" y="24" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1">
      महाराष्ट्र लोकसेवा आयोग • MISSION 2026
    </text>

    <!-- Main Title Heading -->
    <text x="0" y="95" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      MPSC ASPIRANT PREP
    </text>
    
    <text x="0" y="145" fill="url(#goldMetallic)" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800">
      राज्यसेवा व संयुक्त गट-ब आणि क सराव
    </text>

    <text x="0" y="195" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      नकारात्मक गुणांकनासह परिपूर्ण टेस्ट सिरीज, मागील वर्षांचे प्रश्न (PYQs)
    </text>
    <text x="0" y="222" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      आणि मराठी व इंग्रजी व्याकरण मास्टर नोट्स.
    </text>

    <!-- 4 Key Cadre Badges -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="145" height="42" rx="8" fill="#292524" stroke="#44403c" stroke-width="1" />
      <text x="14" y="26" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">उपजिल्हाधिकारी</text>

      <rect x="155" y="0" width="135" height="42" rx="8" fill="#292524" stroke="#44403c" stroke-width="1" />
      <text x="170" y="26" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">पोलीस उपअधीक्षक</text>

      <rect x="300" y="0" width="115" height="42" rx="8" fill="#292524" stroke="#44403c" stroke-width="1" />
      <text x="316" y="26" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">तहसीलदार</text>

      <rect x="425" y="0" width="140" height="42" rx="8" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5" />
      <text x="440" y="26" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">PSI / STI / ASO</text>
    </g>

    <!-- Inscription Quote -->
    <g transform="translate(0, 340)">
      <text x="0" y="25" fill="#f59e0b" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="600">
        "प्रतिपच्चंद्रलेखेव वर्धिष्णुर्विश्ववंदिता शाहसूनोः शिवस्यैषा मुद्रा भद्राय राजते"
      </text>
      <text x="0" y="55" fill="#78716c" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
        सत्य • निष्ठा • लोकसेवा — Duty, Integrity, and Devotion to Public Service
      </text>
    </g>
  </g>

  <!-- Right Side Showcase: The Grand Mantralaya / Vidhan Bhavan & Golden Lion Capital -->
  <g transform="translate(730, 80)">
    <!-- Outer Card Glow -->
    <rect x="-20" y="-10" width="410" height="470" rx="28" fill="#1c1917" fill-opacity="0.85" stroke="#d97706" stroke-width="2" stroke-opacity="0.6" filter="url(#cardShadow)" />
    
    <!-- Header of the Showcase -->
    <rect x="-20" y="-10" width="410" height="50" rx="28" fill="#292524" />
    <rect x="-20" y="15" width="410" height="25" fill="#292524" />
    <text x="185" y="22" fill="#fbbf24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">
      MAHARASHTRA CIVIL SERVICES
    </text>

    <!-- Secretariat / Vidhan Bhavan Architectural Graphic -->
    <g transform="translate(25, 60)">
      <!-- Background Sky within Card -->
      <rect x="0" y="0" width="320" height="240" rx="16" fill="#0c0a09" />
      <circle cx="160" cy="110" r="95" fill="#f59e0b" fill-opacity="0.15" />

      <!-- Sun Rays -->
      <g stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5">
        <line x1="160" y1="110" x2="70" y2="40" />
        <line x1="160" y1="110" x2="160" y2="20" />
        <line x1="160" y1="110" x2="250" y2="40" />
        <line x1="160" y1="110" x2="270" y2="100" />
        <line x1="160" y1="110" x2="50" y2="100" />
      </g>

      <!-- Classical Corinthian / Doric Pillars -->
      <g fill="#292524" stroke="#d97706" stroke-width="1">
        <!-- Steps -->
        <rect x="20" y="200" width="280" height="25" fill="#1c1917" stroke="#b45309" />
        <rect x="35" y="190" width="250" height="10" fill="#292524" stroke="#b45309" />
        <rect x="50" y="180" width="220" height="10" fill="#44403c" stroke="#b45309" />

        <!-- 6 Pillars -->
        <rect x="65" y="100" width="14" height="80" rx="2" fill="#57534e" />
        <rect x="100" y="100" width="14" height="80" rx="2" fill="#57534e" />
        <rect x="135" y="100" width="14" height="80" rx="2" fill="#57534e" />
        <rect x="170" y="100" width="14" height="80" rx="2" fill="#57534e" />
        <rect x="205" y="100" width="14" height="80" rx="2" fill="#57534e" />
        <rect x="240" y="100" width="14" height="80" rx="2" fill="#57534e" />

        <!-- Entablature / Roof Base -->
        <rect x="45" y="90" width="230" height="12" fill="#292524" stroke="#f59e0b" stroke-width="1.5" />

        <!-- Pediment Triangle -->
        <polygon points="40,90 160,35 280,90" fill="#292524" stroke="#f59e0b" stroke-width="2" />

        <!-- Majestic Dome -->
        <path d="M 125 35 Q 160 -5 195 35 Z" fill="#b45309" stroke="#fbbf24" stroke-width="2" />
        <rect x="158" y="-12" width="4" height="8" fill="#fbbf24" />
        <circle cx="160" cy="-15" r="4" fill="#f59e0b" />
      </g>

      <!-- Central Floating Ashoka Golden Medallion -->
      <g transform="translate(160, 115)">
        <circle cx="0" cy="0" r="42" fill="#1c1917" stroke="url(#goldMetallic)" stroke-width="3.5" filter="url(#glow)" />
        <circle cx="0" cy="0" r="36" fill="#0c0a09" stroke="#b45309" stroke-width="1" />

        <!-- Scales of Justice Symbol -->
        <g stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round">
          <!-- Pillar -->
          <line x1="0" y1="-20" x2="0" y2="18" />
          <line x1="-10" y1="18" x2="10" y2="18" />
          <!-- Beam -->
          <line x1="-22" y1="-12" x2="22" y2="-12" />
          <!-- Left Scale -->
          <line x1="-22" y1="-12" x2="-28" y2="-2" />
          <line x1="-22" y1="-12" x2="-16" y2="-2" />
          <path d="M -30 -2 Q -22 6 -14 -2 Z" fill="#f59e0b" />
          <!-- Right Scale -->
          <line x1="22" y1="-12" x2="16" y2="-2" />
          <line x1="22" y1="-12" x2="28" y2="-2" />
          <path d="M 14 -2 Q 22 6 30 -2 Z" fill="#f59e0b" />
        </g>
      </g>
    </g>

    <!-- Bottom Showcase Feature Bar -->
    <g transform="translate(0, 335)">
      <!-- Constitution Badge -->
      <rect x="0" y="0" width="175" height="80" rx="14" fill="#0c0a09" stroke="#44403c" stroke-width="1" />
      <text x="20" y="28" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">
        📖 भारतीय संविधान
      </text>
      <text x="20" y="48" fill="#e7e5e4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
        कलमे, अनुसूची व कायदे
      </text>
      <text x="20" y="65" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="10">
        RTI, IT Act & Polity
      </text>

      <!-- Negative Marking & Mock Tests Badge -->
      <rect x="190" y="0" width="180" height="80" rx="14" fill="#0c0a09" stroke="#d97706" stroke-width="1.5" />
      <text x="210" y="28" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">
        🎯 १/४ निगेटिव्ह मार्किंग
      </text>
      <text x="210" y="48" fill="#e7e5e4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
        MPSC रिअल CBT पॅटर्न
      </text>
      <text x="210" y="65" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="10">
        राज्यसेवा व संयुक्त परीक्षा
      </text>
    </g>
  </g>
</svg>
