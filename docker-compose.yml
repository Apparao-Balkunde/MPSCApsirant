services:
  mpsc-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpsc_aspirant_prep
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - path: .env
        required: false
